# Claude reviews every pull request that is not a draft, as a senior machine learning engineer and programmer.
# What it looks for in this repository is in REVIEW.md. It comments; it never pushes, approves or merges.
#
# Needs the Claude GitHub app on this repository and the secret CLAUDE_CODE_OAUTH_TOKEN (both set by
# /install-github-app). A pull request that changes this file is not reviewed: the action requires the file to be
# identical to the default branch's, so a change here takes effect once it is merged.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request as a senior machine learning engineer and programmer.

            First read REVIEW.md at the repository root: it says what this project is, what to look for and in
            which order, and how to write the review. Follow it. Read README.md if you need the project's layout.

            Then read the pull request with `gh pr view` and `gh pr diff`. Its branch is checked out in the
            working directory: read as much of the surrounding code as you need to judge the change, not only
            the changed lines.

            Report through GitHub only:
            - a finding tied to a line: `mcp__github_inline_comment__create_inline_comment`;
            - the review as a whole: one `gh pr comment`, with the verdict first (ready to merge, or what must
              change before it is), then the findings by importance, then what you checked and found sound.

            Review only. Do not push commits, do not approve, do not merge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
