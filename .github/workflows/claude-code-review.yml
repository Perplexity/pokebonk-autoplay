# Claude reviews every pull request that is not a draft. The review procedure is the official code-review plugin;
# the reviewer's role and what it looks for in this repository are in REVIEW.md (and CLAUDE.md points to it).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The role: appended to the reviewer's system prompt. REVIEW.md carries the detail.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You review this pull request as a senior machine learning engineer and programmer. Before judging the change, read REVIEW.md at the repository root and apply what it asks for in addition to the review procedure: correctness first, then whether every claim about play or learning is backed by a measured batch, then leakage onto the held-out seeds, versions added instead of edited, a test for every change, and the project's offline rules."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
