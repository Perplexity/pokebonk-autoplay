<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox dashboard</title>
<style>
  :root { --bg:#12141c; --panel:#1b1f2b; --line:#2a3042; --ink:#e8ebf4; --mute:#8d95ab; --ok:#5fd08a; --bad:#ef6a6a; --acc:#f2b84b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f5f8; --panel:#fff; --line:#dfe3ec; --ink:#1c2130; --mute:#667089; --ok:#1f9d57; --bad:#c93b3b; --acc:#b9770a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:18px 20px 6px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.2px; }
  header small { color:var(--mute); }
  main { padding:10px 20px 32px; display:grid; gap:14px; grid-template-columns: repeat(12, 1fr); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; grid-column: span 12; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--mute); margin:0 0 10px; font-weight:600; }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap:10px; }
  .kpi b { display:block; font-size:24px; font-variant-numeric: tabular-nums; }
  .kpi span { color:var(--mute); font-size:12px; }
  .live { grid-column: span 5; } .log { grid-column: span 7; }
  @media (max-width: 900px) { .live, .log { grid-column: span 12; } }
  .row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed var(--line); }
  .row:last-child { border:0; } .row span { color:var(--mute); }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0 10px; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .3s; }
  pre { margin:0; font:12px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; color:var(--ink); max-height:300px; overflow:auto; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-variant-numeric: tabular-nums; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mute); font-weight:600; font-size:12px; }
  td.num, th.num { text-align:right; }
  .won { color:var(--ok); } .died { color:var(--bad); } .tag { color:var(--acc); }
  .empty { color:var(--mute); padding:14px 0; }
</style>
</head>
<body>
<header>
  <h1>Sandbox dashboard</h1>
  <small id="sub">local runs only · nothing here leaves this machine</small>
</header>
<main>
  <section><h2>Run journal</h2><div class="kpis" id="kpis"></div></section>
  <section class="live"><h2>Bot now</h2><div id="live"><div class="empty">No bot status yet.</div></div></section>
  <section class="log"><h2>Recent decisions</h2><pre id="decisions">—</pre></section>
  <section><h2>Runs</h2><div class="scroll"><table id="runs"><thead><tr>
    <th>When</th><th>Mode</th><th>Pokémon</th><th>Map</th><th class="num">Time</th><th class="num">Level</th><th class="num">KOs</th><th class="num">Zone</th><th class="num">Bosses</th><th class="num">Captures</th><th>Ended</th>
  </tr></thead><tbody></tbody></table><div class="empty" id="none" hidden>No finished runs in the journal yet.</div></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const clock = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
async function refresh() {
  try {
    const [journal, status] = await Promise.all([fetch('api/journal').then((r) => r.json()), fetch('api/status').then((r) => r.json())]);
    const n = journal.length, deaths = journal.filter((r) => r.how === 'died').length, wins = journal.filter((r) => r.victory).length;
    const sum = (k) => journal.reduce((a, r) => a + (Number(r[k]) || 0), 0), max = (k) => journal.reduce((a, r) => Math.max(a, Number(r[k]) || 0), 0);
    const kpi = [[n, 'runs'], [clock(n ? sum('time') / n : 0), 'average time'], [clock(max('time')), 'longest run'], [max('level'), 'best level'], [deaths, 'deaths'], [wins, 'wins'], [sum('kills').toLocaleString(), 'KOs'], [sum('captures') + sum('shinies'), 'captures']];
    $('kpis').innerHTML = kpi.map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
    const rows = journal.slice().reverse().slice(0, 200).map((r) => `<tr><td>${esc(new Date(r.at).toLocaleString())}</td><td>${esc(r.mode)}</td><td>#${esc(r.species)}</td><td>${esc(r.biome)}${r.tier ? ' <span class="tag">T' + esc(r.tier) + '</span>' : ''}</td><td class="num">${clock(r.time)}</td><td class="num">${esc(r.level)}</td><td class="num">${esc(Number(r.kills).toLocaleString())}</td><td class="num">${esc(r.stage)}</td><td class="num">${esc(r.bosses)}</td><td class="num">${esc(r.captures + r.shinies)}</td><td class="${r.victory ? 'won' : r.how === 'died' ? 'died' : ''}">${esc(r.victory ? 'won' : r.how)}</td></tr>`);
    $('runs').querySelector('tbody').innerHTML = rows.join('');
    $('none').hidden = n > 0;
    const b = status.bot || {}, run = b.run || {}, age = Math.round((status.now - (b.updated || 0)) / 1000);
    const hp = run.maxHp ? Math.round((run.hp / run.maxHp) * 100) : 0;
    const row = (k, v) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
    $('live').innerHTML = row('Phase', (b.phase || 'idle') + (b.note ? ' · ' + b.note : '') + (status.dryRun ? ' (dry run)' : '')) +
      (run.time !== undefined ? `<div class="bar"><i style="width:${hp}%"></i></div>` + row('HP', `${run.hp} / ${run.maxHp}`) + row('Run time', clock(run.time)) + row('Zone · level', `${run.stage} · ${run.level}`) + row('KOs', run.kills) + row('Enemies alive', run.enemies) + row('Ultimate', Math.round((run.ult || 0) * 100) + '%') + row('Guardian', run.boss || '—') + row('Doing', run.intent || '—') : '') +
      row('Runs started / finished', `${run.runsStarted ?? 0} / ${run.runsFinished ?? 0}`) + row('Status age', age + ' s') + row('Mirror: served / missing', `${status.mirror.served} / ${status.mirror.missing}`);
    $('decisions').textContent = (b.decisions || []).join('\n') || '—';
  } catch (e) { $('sub').textContent = 'sandbox host not reachable'; }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
