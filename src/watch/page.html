<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch a run</title>
<style>
  :root {
    --ground: #16302b; --ground-line: #21433b; --panel: #eef1ea; --panel-2: #e2e7dd; --ink: #14211d; --muted: #5c6b64; --rule: #cfd6ca;
    --you: #ffc93c; --enemy: #f0623a; --elite: #b98cff; --alpha: #ffffff; --thing: #58c8c0; --hp: #2f9e63; --hurt: #d8452a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --panel: #111d1a; --panel-2: #182824; --ink: #e7ede6; --muted: #91a199; --rule: #263933; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--panel); color: var(--ink); font: 13px/1.45 ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 330px 270px; height: 100vh; }
  #map { position: relative; background: var(--ground); min-height: 320px; overflow: hidden; }
  #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #bar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: #dfe9e2; }
  #bar .run { margin-right: auto; background: rgba(10, 24, 21, .72); padding: 5px 10px; border-radius: 8px; }
  button { font: inherit; color: #dfe9e2; background: rgba(10, 24, 21, .72); border: 1px solid #3a5c52; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--you); }
  button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--you); border-color: var(--you); color: #1b1606; font-weight: 600; }
  #legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; color: #c5d3cb; background: rgba(10, 24, 21, .72); padding: 5px 10px; border-radius: 8px; font-size: 12px; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #over { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10, 24, 21, .9); color: #f4f7f2; border: 1px solid var(--you); border-radius: 12px; padding: 16px 22px; text-align: center; max-width: 80%; }
  #over b { display: block; font-size: 28px; line-height: 1.2; color: var(--you); }
  [hidden] { display: none !important; }
  #map, section { min-width: 0; }
  section { padding: 14px 16px; border-left: 1px solid var(--rule); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  h1 { font-size: 21px; line-height: 1.2; margin: 0; font-weight: 700; }
  h2 { font-size: 13px; margin: 14px 0 5px; font-weight: 700; color: var(--muted); }
  .sub { color: var(--muted); margin: 2px 0 10px; min-height: 1.45em; }
  .meter { height: 12px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--hp); border-radius: 6px; transition: width .12s linear; }
  .meter.low > div { background: var(--hurt); }
  .meter.xp { height: 5px; margin-top: 5px; } .meter.xp > div { background: var(--you); }
  .pair { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .pair span:last-child { text-align: right; }
  #now { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: var(--panel-2); }
  #now b { display: block; font-size: 15px; }
  #moves { margin: 0; padding: 0; list-style: none; }
  #moves li, .rows li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li span:first-child, #moves li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1; scrollbar-width: thin; }
  #log { margin: 0; padding: 0; list-style: none; }
  #log li { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 4px 0; border-top: 1px solid var(--rule); }
  #log time { color: var(--muted); }
  #log .k { font-weight: 600; }
  #log li.quiet { color: var(--muted); } #log li.quiet .k { font-weight: 400; }
  label.check { color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 12px; }
  .empty { color: var(--muted); }
  @media (max-width: 980px) {
    main { grid-template-columns: minmax(0, 1fr); height: auto; }
    #map { height: 62vh; }
    section { border-left: 0; border-top: 1px solid var(--rule); }
    .scroll { max-height: 50vh; }
  }
</style>
</head>
<body>
<main>
  <div id="map">
    <canvas id="c" aria-label="Top-down map of the run, the player in the middle"></canvas>
    <div id="bar">
      <span class="run" id="run">Waiting for the game to load…</span>
      <button id="pause" aria-pressed="false">Pause</button>
      <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button><button data-speed="16">16×</button>
    </div>
    <div id="legend">
      <span><i style="background:var(--you)"></i>Player</span><span><i style="background:var(--enemy)"></i>Enemy</span><span><i style="background:var(--elite)"></i>Elite</span>
      <span><i style="background:var(--alpha)"></i>Alpha or guardian</span><span><i style="background:var(--thing)"></i>Map point</span><span><i style="background:transparent;border:1px solid var(--you)"></i>Strike about to land</span><span id="scale"></span>
    </div>
    <div id="over" hidden></div>
  </div>
  <section>
    <h1 id="zone">No run yet</h1>
    <div class="sub" id="phase"></div>
    <div class="meter" id="hpm"><div></div></div>
    <div class="pair"><span id="hp">HP</span><span id="level"></span></div>
    <div class="meter xp"><div id="xp"></div></div>
    <div class="pair"><span id="kos"></span><span id="gold"></span></div>
    <div class="pair"><span id="alive"></span><span id="incense"></span></div>
    <div id="now"><b id="intent">…</b><span id="note"></span></div>
    <h2>Moves</h2>
    <ul id="moves"><li class="empty">None yet</li></ul>
    <label class="check"><input type="checkbox" id="all"> Show every change of intent</label>
    <h2>What it did, newest first</h2>
    <div class="scroll"><ul id="log"></ul></div>
  </section>
  <section>
    <h2 style="margin-top:0" id="itemsH">Items</h2>
    <div class="scroll" style="flex:2"><ul class="rows" id="items"><li class="empty">None yet</li></ul></div>
    <h2>Vitamins</h2>
    <ul class="rows" id="vitamins"><li class="empty">None yet</li></ul>
    <h2>Relics</h2>
    <ul class="rows" id="relics"><li class="empty">None</li></ul>
    <h2>Stats</h2>
    <ul class="rows" id="stats"></ul>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const n = (v) => Math.round(v).toLocaleString('en-US');
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const NAMES = { boss: 'Guardian', portal: 'Portal', chest: 'Ball', freechest: 'Great Ball', meowth: 'Shop', bill: 'Bill', hypno: 'Hypno', altar: 'Altar', slots: 'Slots', magnet: 'Magnemite', cursed: 'Cursed altar', cursedchest: 'Cursed ball', greed: 'Gengar', berry: 'Berries', rhydon: 'Rhydon' };
const pointName = (k) => NAMES[k] ?? k.charAt(0).toUpperCase() + k.slice(1);
// Intents that are the plan's orders; the rest (hunting, gathering experience) change every second or two.
const ORDERS = new Set(['errand', 'wake', 'cash', 'stay', 'rift', 'portal', 'leave', 'visit']);

let frame = null, dirty = false, view = 48;
const canvas = $('c'), g = canvas.getContext('2d');
function resize() { const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1; canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d); dirty = true; }
addEventListener('resize', resize);

function draw() {
  requestAnimationFrame(draw);
  if (!dirty) return;
  dirty = false;
  const w = canvas.width, h = canvas.height, d = devicePixelRatio || 1;
  g.fillStyle = css('--ground'); g.fillRect(0, 0, w, h);
  if (!frame) return;
  const f = frame, s = Math.min(w, h) / 2 / view, cx = w / 2, cy = h / 2;
  const X = (x) => cx + (x - f.p.x) * s, Y = (z) => cy + (z - f.p.z) * s;
  // A 10 m grid that moves with the ground, so walking shows.
  g.strokeStyle = css('--ground-line'); g.lineWidth = d; g.beginPath();
  for (let x = Math.floor((f.p.x - cx / s) / 10) * 10; X(x) < w; x += 10) { g.moveTo(X(x), 0); g.lineTo(X(x), h); }
  for (let z = Math.floor((f.p.z - cy / s) / 10) * 10; Y(z) < h; z += 10) { g.moveTo(0, Y(z)); g.lineTo(w, Y(z)); }
  g.stroke();
  // Ground hazards, then shots.
  g.fillStyle = 'rgba(255, 201, 60, .06)'; g.strokeStyle = 'rgba(255, 201, 60, .45)'; g.lineWidth = d;
  for (let i = 0; i < f.hazards.length; i += 3) { g.beginPath(); g.arc(X(f.hazards[i]), Y(f.hazards[i + 1]), Math.max(2, f.hazards[i + 2] * s), 0, 7); g.fill(); g.stroke(); }
  // Map points: in view as a ring with its name, out of view as a name at the edge.
  g.font = `${12 * d}px ui-rounded, system-ui, sans-serif`; g.textBaseline = 'middle';
  const thing = css('--thing'), top = 52 * d, bottom = h - 44 * d, side = 10 * d, line = 16 * d, far = [];
  for (const q of f.points) {
    const px = X(q.x), py = Y(q.z), inside = px > side && px < w - side && py > top && py < bottom;
    g.globalAlpha = q.used ? .35 : 1;
    if (inside) {
      g.strokeStyle = thing; g.lineWidth = 2 * d; g.beginPath(); g.arc(px, py, Math.max(4 * d, q.r * s), 0, 7); g.stroke();
      g.fillStyle = thing; g.textAlign = 'center'; g.fillText(pointName(q.kind), px, py - Math.max(4 * d, q.r * s) - 9 * d);
    } else if (!q.used) far.push({ q, px, py, dist: Math.hypot(q.x - f.p.x, q.z - f.p.z) });
  }
  g.globalAlpha = 1;
  // Points out of view: named at the edge towards them, nearest first; one that would cover another moves along the edge.
  const placed = [];
  g.fillStyle = thing; g.textAlign = 'left';
  for (const { q, px, py, dist } of far.sort((a, b) => a.dist - b.dist)) {
    const text = `${pointName(q.kind)} ${Math.round(dist)} m`, tw = g.measureText(text).width;
    // Where the line from the player to the point leaves the map.
    const k = Math.min(px === cx ? Infinity : ((px > cx ? w - side : side) - cx) / (px - cx), py === cy ? Infinity : ((py > cy ? bottom : top) - cy) / (py - cy));
    let x = Math.max(side, Math.min(w - side - tw, cx + (px - cx) * k - tw / 2)), y = Math.max(top, Math.min(bottom, cy + (py - cy) * k));
    const sideways = y > top && y < bottom;
    const hits = () => placed.some((r) => x < r.x + r.w + 8 * d && r.x < x + tw + 8 * d && Math.abs(r.y - y) < line);
    for (let step = 1; hits() && step <= 24; step++) {
      const shift = Math.ceil(step / 2) * (step % 2 ? 1 : -1);
      if (sideways) y = Math.max(top, Math.min(bottom, cy + (py - cy) * k + shift * line));
      else x = Math.max(side, Math.min(w - side - tw, cx + (px - cx) * k - tw / 2 + shift * (tw + 10 * d)));
    }
    if (hits()) continue;
    placed.push({ x, y, w: tw });
    g.fillText(text, x, y);
  }
  if (f.entrance) { const px = X(f.entrance.x), py = Y(f.entrance.z); g.fillStyle = css('--elite'); g.beginPath(); g.moveTo(px, py - 9 * d); g.lineTo(px + 7 * d, py); g.lineTo(px, py + 9 * d); g.lineTo(px - 7 * d, py); g.closePath(); g.fill(); g.textAlign = 'center'; g.fillText('Rift', px, py - 18 * d); }
  // The line to where the player is heading.
  if (f.goal) { g.strokeStyle = css('--you'); g.lineWidth = 1.5 * d; g.setLineDash([6 * d, 6 * d]); g.beginPath(); g.moveTo(cx, cy); g.lineTo(X(f.goal.x), Y(f.goal.z)); g.stroke(); g.setLineDash([]); }
  // Enemies: ordinary first, so the ones that matter are on top.
  const colors = [css('--enemy'), css('--elite'), css('--alpha'), css('--alpha'), thing];
  for (let pass = 0; pass < 5; pass++) {
    g.fillStyle = colors[pass];
    for (let i = 0; i < f.e.length; i += 4) {
      if (f.e[i + 3] !== pass) continue;
      const r = Math.max(pass === 0 ? 1.6 * d : 3 * d, f.e[i + 2] * s);
      g.beginPath(); g.arc(X(f.e[i]), Y(f.e[i + 1]), r, 0, 7); g.fill();
    }
  }
  g.fillStyle = '#ffb3a1';
  for (let i = 0; i < f.shots.length; i += 3) { g.beginPath(); g.arc(X(f.shots[i]), Y(f.shots[i + 1]), Math.max(1.5 * d, f.shots[i + 2] * s), 0, 7); g.fill(); }
  if (f.boss) { const px = X(f.boss.x), py = Y(f.boss.z), k = f.boss.maxHp > 0 ? f.boss.hp / f.boss.maxHp : 0; g.strokeStyle = css('--hurt'); g.lineWidth = 3 * d; g.beginPath(); g.arc(px, py, 14 * d, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * k); g.stroke(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(`${f.boss.name} ${Math.round(k * 100)} %`, px, py - 24 * d); }
  // The player, with the HP bar as a ring.
  const k = f.p.maxHp > 0 ? Math.max(0, Math.min(1, f.p.hp / f.p.maxHp)) : 0;
  g.fillStyle = css('--you'); g.strokeStyle = '#0c1a17'; g.lineWidth = 2 * d; g.beginPath(); g.arc(cx, cy, 5 * d, 0, 7); g.fill(); g.stroke();
  g.strokeStyle = k < .4 ? css('--hurt') : css('--hp'); g.lineWidth = 2.5 * d; g.beginPath(); g.arc(cx, cy, 10 * d, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * k); g.stroke();
}

// 600: the game starts a zone's final swarm at the zone's second 600, whether its guardian has fallen or not (docs/game.md).
function status(f) {
  $('zone').textContent = f.ot ? `Overtime · round ${f.ot.round}` : f.rift ? `In a rift · zone ${f.zone}` : f.sanctuary ? `Sanctuary · ${clock(f.zoneT)}` : `Zone ${f.zone} · ${clock(f.zoneT)}`;
  $('phase').textContent = f.ot ? (f.ot.live ? `${f.ot.left} s left in the round · bonus ${n(f.ot.bonus)} · the tide takes ${n(f.ot.drain)} HP a second` : `Over · bonus ${n(f.ot.bonus)}`)
    : f.swarm ? `Final swarm for ${clock(f.swarmT)}${f.collapse > 0 ? ` · the collapse takes ${n(f.collapse)} HP a second` : ''}`
    : f.sanctuary ? `Guardian ${f.guardian}` : `Guardian ${f.guardian} · final swarm in ${clock(Math.max(0, 600 - f.zoneT))}`;
  const k = f.p.maxHp > 0 ? f.p.hp / f.p.maxHp : 0;
  $('hpm').firstElementChild.style.width = `${Math.max(0, Math.min(1, k)) * 100}%`; $('hpm').classList.toggle('low', k < .4);
  $('hp').textContent = `HP ${n(f.p.hp)} of ${n(f.p.maxHp)}${f.p.shield > 0 ? ` + ${n(f.p.shield)} shield` : ''}`;
  $('level').textContent = `Level ${n(f.p.level)}`;
  $('xp').style.width = `${Math.max(0, Math.min(1, f.p.xp)) * 100}%`;
  $('kos').textContent = `${n(f.kills)} KOs`; $('gold').textContent = `${n(f.gold)} ₽`;
  $('alive').textContent = `${n(f.enemies)} enemies alive`; $('incense').textContent = `Incense ${f.incense} of 3`;
  $('intent').textContent = f.intent ? f.intent.charAt(0).toUpperCase() + f.intent.slice(1) : '…';
  $('note').textContent = f.note || '';
}

const rows = (id, list, empty) => { const ul = $(id); ul.replaceChildren(...(list.length ? list : [[empty, '']]).map(([a, b]) => { const li = document.createElement('li'), x = document.createElement('span'), y = document.createElement('span'); x.textContent = a; y.textContent = b; if (!list.length) li.className = 'empty'; li.append(x, y); return li; })); };
function build(b) {
  rows('moves', b.moves.map((m) => [m.linked ? `${m.name} + ${m.linked}` : m.name, m.fusion ? `★${m.level}` : `level ${m.level}`]), 'None yet');
  $('itemsH').textContent = `Items (${n(b.itemCount)})`;
  rows('items', b.items.map((it) => [it.name, `×${it.count}`]), 'None yet');
  rows('vitamins', b.vitamins.map((v) => [v.name, `level ${v.level}`]), 'None yet');
  rows('relics', b.relics.map((r) => [r, '']), 'None');
  rows('stats', b.stats.map((x) => [x.name, x.name === 'Max HP' || x.name === 'Luck' || x.name === 'Armor' ? n(x.value) : `×${x.value.toLocaleString('en-US', { maximumFractionDigits: 2 })}`]), '');
}

const LOG_KEPT = 400;
function log(e) {
  const [type, kind] = e.what.split(':');
  const li = document.createElement('li'), t = document.createElement('time'), body = document.createElement('span'), k = document.createElement('span');
  const quiet = type === 'intent' && !ORDERS.has(kind);
  if (quiet) li.className = 'quiet';
  li.dataset.quiet = quiet ? '1' : '';
  li.hidden = quiet && !$('all').checked;
  t.textContent = clock(e.t); k.className = 'k'; k.textContent = type === 'choice' ? `${kind}: ` : type === 'rift' ? 'Rift: ' : `${kind}: `;
  body.append(k, e.detail);
  li.append(t, body);
  $('log').prepend(li);
  while ($('log').children.length > LOG_KEPT) $('log').lastElementChild.remove();
}
$('all').addEventListener('change', () => { for (const li of $('log').children) li.hidden = li.dataset.quiet === '1' && !$('all').checked; });

const control = (m) => fetch('/control', { method: 'POST', body: JSON.stringify(m) });
$('pause').addEventListener('click', () => control({ paused: $('pause').getAttribute('aria-pressed') !== 'true' }));
for (const b of document.querySelectorAll('button[data-speed]')) b.addEventListener('click', () => control({ speed: Number(b.dataset.speed) }));
function controls(c) {
  $('pause').setAttribute('aria-pressed', String(c.paused)); $('pause').textContent = c.paused ? 'Resume' : 'Pause';
  for (const b of document.querySelectorAll('button[data-speed]')) b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === c.speed));
}

const es = new EventSource('/events');
const on = (type, fn) => es.addEventListener(type, (m) => fn(JSON.parse(m.data)));
on('meta', (m) => { $('run').textContent = `Seed ${m.seed} · Pokémon #${m.species} · ${m.map}, tier ${m.tier} · ${m.plan} · game ${m.game}`; document.title = `Watch seed ${m.seed}`; });
on('control', controls);
on('frame', (f) => { frame = f; dirty = true; status(f); });
on('build', build);
on('log', log);
on('end', (s) => { const o = $('over'); o.hidden = false; o.replaceChildren(Object.assign(document.createElement('b'), { textContent: n(s.score) }), `ranked KOs: ${n(s.kills)} of its own${s.bonus ? ` and an Overtime bonus of ${n(s.bonus)} after round ${s.round}` : ''}. Run over (${s.cause}) at level ${n(s.level)}, ${clock(s.time)}.`); });
on('fault', (text) => { const o = $('over'); o.hidden = false; o.textContent = `The game stopped: ${text}. Start the watch again.`; });
es.onerror = () => { if (!frame) $('run').textContent = 'No watch is running: start one with npm run watch -- --seed=1'; };
$('scale').textContent = `Grid 10 m · view ${view} m`;
resize(); draw();
</script>
</body>
</html>
