[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokebonk-rl"
version = "0.1.0"
description = "Offline reinforcement learning on the local, headless game copy (training, evaluation, model registry)."
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.7",
  "stable-baselines3>=2.9,<3",
  "sb3-contrib>=2.9,<3",
  "gymnasium>=1.0",
  "tensorboard",
  "pyyaml",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["pokebonk_rl*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = ["game: starts real game processes (slow)"]
