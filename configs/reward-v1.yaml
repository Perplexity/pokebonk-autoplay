# Reward v1 (python/pokebonk_rl/reward.py). Unit: one KO. Changing a weight means a new version name: the version
# is recorded with every training run, batch and episode, and a run refuses to resume under another reward.
#
# The owner's decisions behind it (2026-11-24): KOs matter more than finishing the run, because the ranking counts
# KOs; overtime is to be survived as long as possible, for its KO multipliers; no shortcuts, no speedruns.
# So: KOs and the overtime bonus are the objective, exactly as the ranking counts them. The milestone payments are a
# hint towards the zones where more KOs are made, not a goal: together 800 for a complete run, against 2,000 in v0.
version: v1
# Everything is multiplied by this before it reaches the learner (the learner also normalises returns).
scale: 0.01
weights:
  ko: 1.0             # per KO
  overtime: 1.0       # per overtime bonus KO, paid as the bonus builds up; taken back if overtime is lost by fainting
  overtime_void: -1.0 # per KO made during an overtime that was lost by fainting (the game: "its KOs are voided")
  guardian: 100.0     # per zone guardian beaten
  zone: 100.0         # per zone entered through a portal (zones 2, 3 and the sanctuary)
  legendary: 200.0    # the sanctuary's legendary beaten
  death: -100.0       # fainting before the map is cleared
