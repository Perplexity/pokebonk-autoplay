# Evaluation configuration (python -m pokebonk_rl.evaluate --config configs/evaluation.yaml --model <checkpoint>).
# Every key is listed with its default in python/pokebonk_rl/config.py; an unknown key is an error.

game:
  build: mwsewi0r

env:
  hz: 60
  action_repeat: 3
  max_game_time: 3600   # the cap the stored baselines were played with (never reached by them)
  # An episode with no KO and no movement for this many game seconds ends there as invalid and scores 0 (the owner's
  # rule, 2026-11-24). The random and heuristic baselines never meet it (docs/baseline.md §13). 0 = no such rule.
  max_idle_game_time: 30
  # The same rule read strictly, after episodes that spent up to 4.5 hours inside a rift (where the zone clock stands
  # still and nothing comes unless a wave is called): no KO for this many game seconds ends the episode as invalid,
  # whether the Pokémon moved or not. The time a guardian or the legendary is alive does not count. 0 = no such rule.
  max_ko_gap_game_time: 30
  # The opening's grace for the rule above (2026-11-25): it does not run during the first this many game seconds of
  # a run. 0 = none, as every run and evaluation of this configuration so far.
  ko_gap_grace_game_time: 0
  ranked: true
  archive: null         # null = the archive the model was trained with (a model is not played on another account preset)

# One scenario per evaluation: results of different Pokémon, maps or tiers are not pooled.
scenario:
  species: 150          # Mewtwo
  map: forest
  tier: 0

# The held-out seeds (docs/baseline.md §10): idle, random and heuristic are stored on them (labels heldout-mewtwo-*),
# so a model is compared episode by episode. Nothing is tuned on these seeds. For a look while tuning, use the
# development seeds instead:  --seeds 1-30 --reference baseline-mewtwo-random   (information, never a verdict).
seeds: "900001-900050"

workers:
  envs: 5
  recycle_after: 1      # one episode per game process: an episode depends on how long the process's clock has run (docs/environment.md §3, cause 5)
  recycle_rss_mb: 1500
  step_timeout: 300
  reset_timeout: 600

deterministic: true     # the most probable action at every step; false = sample
device: cpu
reward_file: reward-v6.yaml

# What a model must do to be promotable to stable: `metric` over the seeds, divided by the reference's, must reach
# `min_ratio`, and no episode may be lost to an error. The reference is the stable model's own evaluation on the same
# seeds and scenario when a stable model exists, else the stored batch with the label `first_reference`.
# Only an evaluation on exactly `seeds` below, against that reference, counts as a verdict (`evaluations.passed`).
promotion:
  metric: score_median  # score = KOs + cashed overtime bonus
  min_ratio: 1.0
  floors: {}            # further metrics that must each reach their own ratio, e.g. {score_median: 0.9}
  first_reference: heldout-mewtwo-random
  seeds: "900001-900050"

paths:
  database: data/pokebonk.sqlite
  models: models
  logs: logs/evaluation
