# The manager (phase 2 of the heuristic + RL refactor): python -m pokebonk_rl.train --config configs/manager.yaml
# and python -m pokebonk_rl.bc collect|fit --config configs/manager.yaml. docs/hybrid.md describes all of it.
# Every key is listed with its default in python/pokebonk_rl/config.py; an unknown key is an error.

name: null
seed: 1

game:
  build: mwsewi0r

env:
  hz: 60
  action_repeat: 3      # the brain's rate under a skill: 20 key decisions per game second
  max_game_time: 7200   # the safety cap the heuristic's batches were played with
  max_idle_game_time: 30      # the owner's rule against standing still
  max_ko_gap_game_time: 30    # ...and against going without a KO (not inside a rift, not while a guardian is up)
  # The opening's grace (the owner, 2026-11-25): the no-KO rule does not run during the first 90 game seconds of a
  # run. The heuristic opens by walking to the free chests at level 1 and went up to 41 s without a KO there.
  ko_gap_grace_game_time: 90
  ranked: true
  archive: balanced     # account preset unlocked-v4:balanced (phase 1). A model is refused on another preset.

scenarios:
  species: [150]        # Mewtwo
  maps: [forest]
  tiers: [2]

episode_seeds:
  first: 1000000        # far from the development seeds (1-30) and the held-out seeds (900001-900050)

workers:
  envs: 10
  spares: 2
  recycle_after: 1      # one episode per game process: an episode depends on how long the process's clock has run (docs/environment.md §3, cause 5)
  recycle_rss_mb: 1500
  max_errors: 20
  step_timeout: 300
  reset_timeout: 600

reward_file: reward-v7.yaml   # phase 3: the change of sqrt(KOs + Overtime bonus), 5 for a run of 20 million (reward-v7log.yaml: the logarithm)

ppo:
  n_steps: 512          # manager decisions per game process per update (about 8 game minutes each)
  batch_size: 1024
  n_epochs: 4
  learning_rate: 1.0e-4
  gamma: 0.999          # not used by the manager: its discount is by game time (manager.horizon_seconds)
  gae_lambda: 0.95
  clip_range: 0.1
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

network:
  architecture: manager-v1
  features_dim: 512     # the mix of everything; the heuristic's proposal is appended to it unchanged
  pi: []                # one linear layer from there to the action: the proposal has a direct path
  vf: [256]

# v7 is already in the learner's unit (a whole run returns 1 to 5), and the value network of the warm start is
# trained on those returns as they are: no running normalisation in between.
normalize_reward: false

manager:
  enabled: true
  plan: {}                      # the heuristic's default plan (plan-3)
  slice_seconds: 1.0            # a skill runs this long before the manager is asked again...
  end_on_proposal_change: true  # ...or until the heuristic's own proposal changes
  fuse_needs: tm-case           # Bill's machine: no fusion and no link without the TM Case (moves go to level 10 with it)
  horizon_seconds: 1000.0       # discount by elapsed game time: a reward 1000 game seconds away counts 1/e
  proposal_logit: 8.0           # an untrained manager takes the proposal (most probable action: always)
  # Skills that cannot be taken back in the next second start this much less likely than any other when the heuristic
  # does not propose them (and as likely as any proposal when it does). Measured without it (seeds 1-10, sampled):
  # Overtime was cashed by a sampled "portal" after 6.5 to 8.5 rounds instead of 9.9. Training moves these like any weight.
  rare_actions: { "skill:portal": 4.0, "skill:wake": 4.0 }
  stray_penalty: 0.0            # reward per decision that is not the proposal, at the start of a PPO run...
  stray_fade_timesteps: 0       # ...fading to zero over this many timesteps (set both for a PPO run)
  init_from: null               # the copy of the heuristic a PPO run starts from (a run name or checkpoint folder)

total_timesteps: 2000000
checkpoint_every_timesteps: 50000
device: cpu
store_decisions: false

paths:
  database: data/pokebonk.sqlite
  models: models
  tensorboard: logs/tensorboard
  logs: logs/training
