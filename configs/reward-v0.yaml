# Reward v0 (python/pokebonk_rl/reward.py). Unit: one KO. Changing a weight means a new version name: the version
# is recorded with every training run, batch and episode, and a run refuses to resume under another reward.
version: v0
# Everything is multiplied by this before it reaches the learner (the learner also normalises returns).
scale: 0.01
weights:
  ko: 1.0          # per KO: the largest share of the reward in every baseline episode
  guardian: 250.0  # per zone guardian beaten
  zone: 250.0      # per zone entered through a portal (zones 2, 3 and the sanctuary)
  legendary: 500.0 # the sanctuary's legendary beaten
  overtime: 1.0    # per overtime bonus KO, paid at the end and only when overtime was cashed
  death: -100.0    # fainting before the map is cleared
