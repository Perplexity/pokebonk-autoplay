# Training configuration (python -m pokebonk_rl.train --config configs/training.yaml).
# Every key is listed with its default in python/pokebonk_rl/config.py; an unknown key is an error.

name: null              # run name; null = ppo-<UTC date and time>
seed: 1                 # the learner's own seed (network initialisation, action sampling)

game:
  build: mwsewi0r

env:
  hz: 60
  action_repeat: 3      # 20 decisions per game second
  max_game_time: 0      # 0 = no cap: an episode ends when the run ends
  # The owner's rule (2026-11-24): an episode with no KO and no movement for this many game seconds ends there and is
  # invalid (a run like that never ends in the game either). 0 = no such rule. What it costs: `idle` in the reward file.
  max_idle_game_time: 30
  # The same rule read strictly, after episodes that spent up to 4.5 hours inside a rift (where the zone clock stands
  # still and nothing comes unless a wave is called): no KO for this many game seconds ends the episode as invalid,
  # whether the Pokémon moved or not. The time a guardian or the legendary is alive does not count. 0 = no such rule.
  max_ko_gap_game_time: 30
  # The opening's grace for the rule above (2026-11-25): it does not run during the first this many game seconds of
  # a run. 0 = none, as every run and evaluation of this configuration so far.
  ko_gap_grace_game_time: 0
  ranked: true
  archive: null         # null = account preset unlocked-v3; empty | loose | balanced | narrow = unlocked-v4 with that item archive

# Each episode draws one of each, uniformly, decided by the episode's number.
scenarios:
  species: [150]        # Mewtwo (the owner's choice for Stage 3: one Pokémon for now)
  maps: [forest]
  tiers: [0]

# Episode k of a run is played on seed first + k. Kept far from the evaluation seeds (configs/evaluation.yaml).
episode_seeds:
  first: 1000000

workers:
  envs: 5               # game processes stepped together
  spares: 2             # extra processes kept reset, so that an ending episode does not stall the others
  recycle_after: 1      # one episode per game process: an episode depends on how long the process's clock has run (docs/environment.md §3, cause 5)
  recycle_rss_mb: 1500
  max_errors: 20        # environment errors per session before training stops
  step_timeout: 300
  reset_timeout: 600

reward_file: reward-v6.yaml

ppo:
  n_steps: 1024         # per environment per update
  batch_size: 1024
  n_epochs: 4
  learning_rate: 3.0e-4
  gamma: 0.999          # horizon of about 1000 decisions = 50 game seconds
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

network:
  architecture: sets-v1
  features_dim: 512
  pi: [256]
  vf: [256]

normalize_reward: true  # divide rewards by a running estimate of the return's spread (saved with every checkpoint)

# The manager (phase 2; configs/manager.yaml is the configuration that uses it). Off here: this file trains the
# low-level policy, which presses keys 20 times a game second.
manager:
  enabled: false
  plan: {}
  slice_seconds: 1.0
  end_on_proposal_change: true
  fuse_needs: tm-case
  horizon_seconds: 1000.0
  proposal_logit: 8.0
  stray_penalty: 0.0
  stray_fade_timesteps: 0
  init_from: null

total_timesteps: 2000000
checkpoint_every_timesteps: 100000
# cpu is the measured choice for this network: decisions are made for a handful of game processes at a time, and such
# small batches cost more on the GPU than on the CPU (392 against 252 decisions per second with 5 processes,
# docs/training.md). "cuda" and "auto" (the GPU when there is one) are accepted.
device: cpu
store_decisions: false  # true = keep every dialog of every training episode in the database (large)

paths:
  database: data/pokebonk.sqlite
  models: models
  tensorboard: logs/tensorboard
  logs: logs/training
