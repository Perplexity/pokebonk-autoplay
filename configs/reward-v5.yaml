# Reward v5 (python/pokebonk_rl/reward.py). Unit: one KO. Changing a weight means a new version name: the version
# is recorded with every training run, batch and episode, and a run refuses to resume under another reward.
#
# The owner's order of importance (2026-11-24): "KOs are most important, overtime KOs per zone is next, so the longer
# the run goes per zone the better, spending pokedollars and opening item chests and other map interactions is next,
# then earning pokedollars, and then its everything else."
#
# How the weights follow it (checked by a test, python/tests/test_units.py, and on the stored episodes,
# docs/training.md §3 "The order of importance"):
#   1. KOs                     `ko`: 1 each. They are the ranking's count.
#   2. KOs of staying          a zone's final swarm (from minute 10 of the zone) is where most KOs are made; they are
#                              KOs and are paid as KOs, and nothing pays for leaving a zone early (see 5). Overtime
#                              after the legendary: `overtime`, the game's own bonus KOs, 1 each.
#   3. spending and the map    `map_use` + `point_use` (50 per map point), `item` (30), `spend` (0.1 per Pokédollar).
#   4. earning                 `earn`: 0.05 per Pokédollar, half of a Pokédollar spent.
#   5. everything else         `guardian`, `zone`, `legendary`: 25, 25, 50 (v4: 100, 100, 200). A guardian beaten and
#                              the next zone entered pay together what one map point pays.
version: v5
# Everything is multiplied by this before it reaches the learner (the learner also normalises returns).
scale: 0.01
weights:
  ko: 1.0             # per KO
  overtime: 1.0       # per Overtime bonus KO, paid as the bonus builds up; taken back if Overtime is lost by fainting
  overtime_void: -1.0 # per KO made during an Overtime that was lost by fainting (the game: "its kills are voided")
  map_use: 10.0       # per use of the map: a map point, a shop purchase, a slot-machine spin, a lesson, a rift, a Max form
  point_use: 40.0     # on top of map_use, per map point used (each point once: a Poké Ball opened, an altar, a cage, …)
  item: 30.0          # per item by which the collection grows beyond the largest it has been
  spend: 0.1          # per Pokédollar spent. A Poké Ball of 60 ₽: 6, with its point and its item 86 in all
  earn: 0.05          # per Pokédollar earned
  guardian: 25.0      # per zone guardian beaten
  zone: 25.0          # per zone entered through a portal (zones 2, 3 and the sanctuary)
  legendary: 50.0     # the sanctuary's legendary beaten
  death: -100.0       # fainting before the map is cleared
  shop_sale: -30.0    # per owned item sold in the shop
  idle: -100.0        # an episode ended by the rule against standing still
