# Reward v6 (python/pokebonk_rl/reward.py). Unit: one KO. Changing a weight means a new version name: the version
# is recorded with every training run, batch and episode, and a run refuses to resume under another reward.
#
# v5 (the owner's order of importance: KOs, the KOs of staying, spending and the map, earning, everything else) plus
# the owner's decision of 2026-11-24 about rifts: "We should allow rifts infinite time, but we need a way of rewarding
# a rift completion based on how quickly we cleared it. The quicker, the more rewards."
#
# The first half is the environment's: neither rule against going without a KO runs inside a rift
# (src/environment, koGapTooLong and idleTooLong). The second half is `rift` below.
version: v6
# Everything is multiplied by this before it reaches the learner (the learner also normalises returns).
scale: 0.01
weights:
  ko: 1.0             # per KO
  overtime: 1.0       # per Overtime bonus KO, paid as the bonus builds up; taken back if Overtime is lost by fainting
  overtime_void: -1.0 # per KO made during an Overtime that was lost by fainting (the game: "its kills are voided")
  map_use: 10.0       # per use of the map: a map point, a shop purchase, a slot-machine spin, a lesson, a rift, a Max form
  point_use: 40.0     # on top of map_use, per map point used (each point once: a Poké Ball opened, an altar, a cage, …)
  item: 30.0          # per item by which the collection grows beyond the largest it has been
  spend: 0.1          # per Pokédollar spent. A Poké Ball of 60 ₽: 6, with its point and its item 86 in all
  earn: 0.05          # per Pokédollar earned
  guardian: 25.0      # per zone guardian beaten
  zone: 25.0          # per zone entered through a portal (zones 2, 3 and the sanctuary)
  legendary: 50.0     # the sanctuary's legendary beaten
  death: -100.0       # fainting before the map is cleared
  shop_sale: -30.0    # per owned item sold in the shop
  idle: -100.0        # an episode ended by the rule against standing still
  # A rift completed: cleared and left through its portal. Paid on leaving, by the seconds spent inside:
  # 150 x 60 / (60 + seconds). 30 s: 100. 60 s: 75. 2 min: 50. 5 min: 25. 47 min: 3. Never nothing, never a penalty.
  # A quick rift is worth about two map points; its KOs and its 10 of map_use are paid as before.
  rift: 150.0
